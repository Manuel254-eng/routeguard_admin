# Apache VirtualHost for the RouteGuard admin console (static files built by GitHub Actions).
#   /etc/apache2/sites-available/admin.routeguard.finances.tools.conf
# HTTPS is added by: sudo certbot --apache -d admin.routeguard.finances.tools
# Modules: sudo a2enmod headers rewrite expires

<VirtualHost *:80>
    ServerName admin.routeguard.finances.tools
    DocumentRoot /opt/routeguard/admin/current

    <Directory /opt/routeguard/admin>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Single-page app: unknown paths (e.g. /billing, /users/12) load index.html.
    FallbackResource /index.html

    # Hashed build files can be cached for a year; index.html must always be fresh.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/admin.routeguard.finances.tools-error.log
    CustomLog ${APACHE_LOG_DIR}/admin.routeguard.finances.tools-access.log combined
</VirtualHost>
